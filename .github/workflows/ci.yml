name: Static asset verification

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu / Node 22
            os: ubuntu-latest
            node: 22
          - name: Windows / Node 24
            os: windows-latest
            node: 24
          - name: macOS / Node 24
            os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify DevCharter-owned static assets
        run: npm run verify
      - name: Check diff whitespace
        run: git diff --check
