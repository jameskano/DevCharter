name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  qualify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu / Node 22
            os: ubuntu-latest
            node: 22
          - name: Ubuntu / Node 24
            os: ubuntu-latest
            node: 24
          - name: Windows / Node 24
            os: windows-latest
            node: 24
          - name: macOS / Node 24
            os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
      - name: Unit and integration tests
        run: pnpm test
      - name: Release fixtures and E2E journeys
        run: pnpm test:release
      - name: Package and fresh-install qualification
        run: pnpm package:qualify
      - name: Deterministic repository validation
        run: pnpm devcharter validate --format json
      - name: Audit no-write verification
        run: pnpm test:audit-no-write
      - name: Diff whitespace check
        run: git diff --check
